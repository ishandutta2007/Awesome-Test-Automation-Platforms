<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <radialGradient id="glowViolet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="85%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 12px;
      }

      /* CSS Animations */
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes scanEffect {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes beamFlow {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes progressAnim {
        0% { width: 0px; }
        50% { width: 330px; }
        100% { width: 330px; }
      }

      .floating-group {
        animation: floatCard 6s ease-in-out infinite;
      }
      .pulsing-indicator {
        animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      .scanner-beam {
        animation: scanEffect 3.5s linear infinite;
      }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: beamFlow 1.8s linear infinite;
      }
      .live-progress {
        animation: progressAnim 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#glowViolet)" />
  <rect width="1200" height="420" fill="url(#glowCyan)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Geometric Accent Network (Left Background) -->
  <g opacity="0.25">
    <circle cx="120" cy="80" r="3" fill="#60a5fa" />
    <circle cx="280" cy="40" r="2.5" fill="#a78bfa" />
    <circle cx="560" cy="70" r="3" fill="#38bdf8" />
    <path d="M 120 80 L 280 40 L 560 70" stroke="#60a5fa" stroke-width="1" fill="none" class="flow-path" />
  </g>

  <!-- FOREGROUND TEXT SECTION (Left Side: x=70) -->
  <g transform="translate(70, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#10b981" class="pulsing-indicator" />
      <text x="32" y="18.5" fill="#38bdf8" class="badge-text">TEST AUTOMATION ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#titleGrad)" class="title-text">Awesome Test Automation</text>
    <text x="0" y="180" fill="#f8fafc" class="title-text">Platforms &amp; Frameworks</text>

    <!-- Subtitle -->
    <text x="0" y="222" class="subtitle-text">Curated SaaS Suites &amp; Open-Source Tools for Reliable Continuous Testing</text>
    <text x="0" y="248" class="subtitle-text" font-size="16px" fill="#64748b">Cross-Browser • Low-Code • Self-Healing • Visual AI • Mobile &amp; API Automation</text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 285)">
      <!-- Pill 1: E2E & Cross-Browser -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21.5" fill="#93c5fd" class="badge-text">⚡ Cross-Browser</text>
      </g>
      <!-- Pill 2: AI & Self-Healing -->
      <g transform="translate(155, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21.5" fill="#c4b5fd" class="badge-text">🤖 Self-Healing</text>
      </g>
      <!-- Pill 3: Low-Code & Codeless -->
      <g transform="translate(305, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21.5" fill="#6ee7b7" class="badge-text">🧩 Codeless UI</text>
      </g>
      <!-- Pill 4: CI/CD Orchestration -->
      <g transform="translate(450, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="14" y="21.5" fill="#fde047" class="badge-text">🔄 CI/CD Automation</text>
      </g>
    </g>

    <!-- Footer Meta -->
    <text x="0" y="375" fill="#475569" class="code-font">UPDATED FOR 2026 • SAAS &amp; OPEN-SOURCE DIRECTORY</text>
  </g>

  <!-- DYNAMIC TELEMETRY / RUNNER CARD (Right Side: x=740) -->
  <g class="floating-group" transform="translate(740, 48)">
    <!-- Outer Card Glow -->
    <rect x="-2" y="-2" width="404" height="324" rx="18" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />
    
    <!-- Main Card Body -->
    <rect width="400" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

    <!-- Terminal Window Bar -->
    <rect width="400" height="38" rx="16" fill="#0f172a" />
    <rect y="26" width="400" height="12" fill="#0f172a" />
    <circle cx="20" cy="19" r="6" fill="#ef4444" opacity="0.85" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" opacity="0.85" />
    <circle cx="56" cy="19" r="6" fill="#10b981" opacity="0.85" />
    <text x="135" y="23" fill="#64748b" class="code-font" font-size="11px">qa-runner --matrix e2e</text>

    <!-- Scanner Beam Line Animation -->
    <rect x="15" y="50" width="370" height="2" fill="url(#barGrad)" opacity="0.5" class="scanner-beam" />

    <!-- Test Run Output Lines -->
    <g transform="translate(20, 68)">
      <!-- Line 1: Playwright Test -->
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="18" y="10" fill="#34d399" class="code-font" font-weight="600">PASS</text>
      <text x="60" y="10" fill="#cbd5e1" class="code-font">e2e/auth-flow.spec.ts</text>
      <text x="310" y="10" fill="#64748b" class="code-font">1.2s</text>

      <!-- Line 2: Cypress / Self-Healing -->
      <g transform="translate(0, 28)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="18" y="10" fill="#34d399" class="code-font" font-weight="600">PASS</text>
        <text x="60" y="10" fill="#cbd5e1" class="code-font">e2e/payment-stripe.spec.ts</text>
        <text x="310" y="10" fill="#64748b" class="code-font">2.4s</text>
      </g>

      <!-- Line 3: AI Self-Healing Event -->
      <g transform="translate(0, 56)">
        <circle cx="6" cy="6" r="4" fill="#818cf8" class="pulsing-indicator" />
        <text x="18" y="10" fill="#a5b4fc" class="code-font" font-weight="600">HEAL</text>
        <text x="60" y="10" fill="#93c5fd" class="code-font">selector #submit-order</text>
        <text x="290" y="10" fill="#818cf8" class="code-font">0.08s</text>
      </g>

      <!-- Line 4: Visual Regression -->
      <g transform="translate(0, 84)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="18" y="10" fill="#34d399" class="code-font" font-weight="600">PASS</text>
        <text x="60" y="10" fill="#cbd5e1" class="code-font">vrt/theme-dark-mode.spec.ts</text>
        <text x="310" y="10" fill="#64748b" class="code-font">3.1s</text>
      </g>

      <!-- Line 5: API Load Test -->
      <g transform="translate(0, 112)">
        <circle cx="6" cy="6" r="4" fill="#10b981" />
        <text x="18" y="10" fill="#34d399" class="code-font" font-weight="600">PASS</text>
        <text x="60" y="10" fill="#cbd5e1" class="code-font">k6/load-5000-vus.spec.ts</text>
        <text x="310" y="10" fill="#64748b" class="code-font">4.8s</text>
      </g>

      <!-- Status Summary Box -->
      <g transform="translate(0, 142)">
        <rect width="360" height="58" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
        
        <!-- Animated Progress Bar -->
        <rect x="15" y="14" width="330" height="6" rx="3" fill="#1e293b" />
        <rect x="15" y="14" width="330" height="6" rx="3" fill="url(#barGrad)" class="live-progress" />

        <text x="15" y="44" fill="#10b981" class="code-font" font-weight="700">✓ 142 Passed</text>
        <text x="115" y="44" fill="#94a3b8" class="code-font">0 Failed</text>
        <text x="185" y="44" fill="#818cf8" class="code-font">⚡ 3 Healed</text>
        <text x="270" y="44" fill="#38bdf8" class="code-font">100% Suites</text>
      </g>
    </g>
  </g>
</svg>
