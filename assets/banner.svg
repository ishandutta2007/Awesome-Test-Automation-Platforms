<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <radialGradient id="cyanOrb" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoOrb" cx="85%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldOrb" cx="50%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Scanner Beam Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Title Crisp Shadow Filter -->
    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');

      .font-sans {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }

      /* Dynamic CSS Animations */
      @keyframes floatAnimation {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }

      @keyframes scanMotion {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(185px); opacity: 0; }
      }

      @keyframes dashFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes fillProgress {
        0% { width: 50px; }
        50% { width: 358px; }
        100% { width: 358px; }
      }

      @keyframes circuitBlink {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.65; }
      }

      .floating-card {
        animation: floatAnimation 6.5s ease-in-out infinite;
      }

      .pulse-indicator {
        animation: pulseGlow 2.2s ease-in-out infinite;
        transform-origin: center;
      }

      .scanner-line {
        animation: scanMotion 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .animated-wire {
        stroke-dasharray: 6 6;
        animation: dashFlow 2s linear infinite;
      }

      .live-bar {
        animation: fillProgress 4.5s ease-in-out infinite;
      }

      .circuit-pulse {
        animation: circuitBlink 3.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgCanvas)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />
  <rect width="1200" height="420" fill="url(#cyanOrb)" />
  <rect width="1200" height="420" fill="url(#indigoOrb)" />
  <rect width="1200" height="420" fill="url(#emeraldOrb)" />

  <!-- DYNAMIC BACKGROUND FLOW CIRCUITS (Strictly in background layer behind all text) -->
  <g opacity="0.4" class="circuit-pulse">
    <!-- Top-left network wires -->
    <path d="M 60 40 L 220 40 L 260 80 L 480 80" fill="none" stroke="#0ea5e9" stroke-width="1.2" class="animated-wire" />
    <circle cx="60" cy="40" r="3" fill="#38bdf8" />
    <circle cx="260" cy="80" r="2.5" fill="#818cf8" />
    <circle cx="480" cy="80" r="3" fill="#34d399" />

    <!-- Bottom ambient circuit -->
    <path d="M 80 390 L 320 390 L 360 360 L 640 360" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="80" cy="390" r="2.5" fill="#6366f1" />
    <circle cx="360" cy="360" r="2.5" fill="#a855f7" />
  </g>

  <!-- RIGHT SIDE: DYNAMIC TELEMETRY / AUTOMATION RUNNER CARD (Positioned x=710 to 1140, completely separated from title zone) -->
  <g class="floating-card" transform="translate(710, 42)">
    <!-- Fallback SMIL translation oscillation -->
    <animateTransform attributeName="transform" type="translate" values="710,42; 710,35; 710,42" dur="6.5s" repeatCount="indefinite" />

    <!-- Outer Glow Border -->
    <rect x="-1" y="-1" width="432" height="338" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />
    
    <!-- Main Window Container -->
    <rect width="430" height="336" rx="16" fill="url(#cardBg)" filter="url(#softShadow)" />

    <!-- Terminal Window Title Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 414 0 C 422.84 0 430 7.16 430 16 L 430 42 L 0 42 Z" fill="#0c1322" />
    <line x1="0" y1="42" x2="430" y2="42" stroke="#1f293d" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="22" cy="21" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="40" cy="21" r="5.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="58" cy="21" r="5.5" fill="#10b981" opacity="0.85" />

    <!-- Window Title / Command -->
    <text x="145" y="25" fill="#94a3b8" class="font-mono" font-size="11.5" font-weight="600">qa-orchestrator --live-matrix</text>

    <!-- Active Status Beacon inside Header -->
    <g transform="translate(385, 14)">
      <circle cx="7" cy="7" r="4" fill="#10b981" class="pulse-indicator">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="7" cy="7" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Sweeping Scanner Beam Animation -->
    <rect x="15" y="52" width="400" height="2" fill="url(#scanGrad)" class="scanner-line">
      <animate attributeName="y" values="52; 240; 52" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1; 0.9; 0.1" dur="3.8s" repeatCount="indefinite" />
    </rect>

    <!-- Test Suite Rows Container -->
    <g transform="translate(20, 62)">
      <!-- Row 1: Playwright Cross-Browser -->
      <g transform="translate(0, 0)">
        <rect width="390" height="34" rx="7" fill="#141e33" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="48" height="18" rx="4" fill="#065f46" />
        <text x="16" y="21" fill="#34d399" class="font-mono" font-size="10" font-weight="700">PASS</text>
        <text x="64" y="21" fill="#f1f5f9" class="font-mono" font-size="11.5">playwright/e2e-checkout.spec.ts</text>
        <text x="345" y="21" fill="#64748b" class="font-mono" font-size="11">1.2s</text>
      </g>

      <!-- Row 2: AI Self-Healing Selector Engine -->
      <g transform="translate(0, 42)">
        <rect width="390" height="34" rx="7" fill="#141e33" stroke="#2e1065" stroke-width="1" />
        <rect x="8" y="8" width="48" height="18" rx="4" fill="#4c1d95" />
        <text x="16" y="21" fill="#c084fc" class="font-mono" font-size="10" font-weight="700">HEAL</text>
        <text x="64" y="21" fill="#e0e7ff" class="font-mono" font-size="11.5">self-heal/locators.auth.js</text>
        <text x="338" y="21" fill="#a78bfa" class="font-mono" font-size="11">0.18s</text>
      </g>

      <!-- Row 3: Visual Regression Testing -->
      <g transform="translate(0, 84)">
        <rect width="390" height="34" rx="7" fill="#141e33" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="48" height="18" rx="4" fill="#065f46" />
        <text x="16" y="21" fill="#34d399" class="font-mono" font-size="10" font-weight="700">PASS</text>
        <text x="64" y="21" fill="#f1f5f9" class="font-mono" font-size="11.5">visual/theme-matrix.spec.ts</text>
        <text x="345" y="21" fill="#64748b" class="font-mono" font-size="11">2.4s</text>
      </g>

      <!-- Row 4: Distributed Performance k6 -->
      <g transform="translate(0, 126)">
        <rect width="390" height="34" rx="7" fill="#141e33" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="48" height="18" rx="4" fill="#065f46" />
        <text x="16" y="21" fill="#34d399" class="font-mono" font-size="10" font-weight="700">PASS</text>
        <text x="64" y="21" fill="#f1f5f9" class="font-mono" font-size="11.5">k6/load-distributed-10k.js</text>
        <text x="345" y="21" fill="#64748b" class="font-mono" font-size="11">4.1s</text>
      </g>

      <!-- Live Execution Telemetry Footer Panel -->
      <g transform="translate(0, 172)">
        <rect width="390" height="82" rx="10" fill="#0a0f1d" stroke="#1e293b" stroke-width="1.2" />

        <!-- Progress Bar Background & Active Bar -->
        <text x="16" y="22" fill="#94a3b8" class="font-mono" font-size="10.5" font-weight="600">TEST RUN SUITE COMPLETION</text>
        <text x="330" y="22" fill="#10b981" class="font-mono" font-size="11" font-weight="700">100%</text>

        <rect x="16" y="32" width="358" height="7" rx="3.5" fill="#1e293b" />
        <rect x="16" y="32" width="358" height="7" rx="3.5" fill="url(#progressGrad)" class="live-bar">
          <animate attributeName="width" values="60; 358; 358" dur="4.5s" repeatCount="indefinite" />
        </rect>

        <!-- Metrics Grid -->
        <g transform="translate(16, 56)">
          <!-- Metric 1: Tests Passed -->
          <circle cx="5" cy="10" r="3.5" fill="#10b981" />
          <text x="14" y="14" fill="#10b981" class="font-mono" font-size="11" font-weight="700">284 Passed</text>

          <!-- Metric 2: Zero Failures -->
          <circle cx="120" cy="10" r="3.5" fill="#64748b" />
          <text x="129" y="14" fill="#94a3b8" class="font-mono" font-size="11">0 Failed</text>

          <!-- Metric 3: AI Self-Healed -->
          <circle cx="215" cy="10" r="3.5" fill="#c084fc" class="pulse-indicator">
            <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
          </circle>
          <text x="224" y="14" fill="#c084fc" class="font-mono" font-size="11" font-weight="700">6 Healed</text>

          <!-- Metric 4: Cloud Duration -->
          <text x="315" y="14" fill="#38bdf8" class="font-mono" font-size="11">⚡ 18.2s</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FOREGROUND TEXT SECTION (Left: x=60 to x=680)                              -->
  <!-- Placed in DOM AFTER background and dashboard to guarantee foreground z-index -->
  <!-- Crisp typography, high contrast, zero overlap with animated graphics      -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 0)">
    
    <!-- Top Ecosystem Status Pill -->
    <g transform="translate(0, 48)">
      <rect width="275" height="30" rx="15" fill="#0f172a" stroke="#2563eb" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" class="pulse-indicator">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="16" cy="15" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4" />
      <text x="32" y="20" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">QA AUTOMATION ECOSYSTEM</text>
    </g>

    <!-- Main Title (Lines 1 & 2) -->
    <!-- Line 1: Gradient Accent -->
    <text x="0" y="132" fill="url(#titleGradient)" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1" filter="url(#titleShadow)">
      Awesome Test Automation
    </text>

    <!-- Line 2: Crisp Foreground White -->
    <text x="0" y="184" fill="#ffffff" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1" filter="url(#titleShadow)">
      Platforms &amp; Frameworks
    </text>

    <!-- Subtitle: Primary Value Proposition -->
    <text x="0" y="228" fill="#e2e8f0" class="font-sans" font-size="16.5" font-weight="600" letter-spacing="-0.2">
      Curated Directory of Cloud Grids, E2E Frameworks &amp; Modern QA Tools
    </text>

    <!-- Subtitle: Secondary Technical Topics -->
    <text x="0" y="255" fill="#94a3b8" class="font-sans" font-size="14.5" font-weight="400">
      Cross-Browser • AI Self-Healing • Codeless UI • Visual AI • Performance &amp; APIs
    </text>

    <!-- High-Contrast Feature Badges Row -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: Cross-Browser & E2E -->
      <g transform="translate(0, 0)">
        <rect width="136" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" />
        <rect x="0" y="0" width="136" height="36" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.3" />
        <text x="14" y="23" fill="#7dd3fc" class="font-sans" font-size="13" font-weight="600">⚡ Cross-Browser</text>
      </g>

      <!-- Badge 2: AI & Self-Healing -->
      <g transform="translate(148, 0)">
        <rect width="138" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" />
        <rect x="0" y="0" width="138" height="36" rx="8" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-opacity="0.3" />
        <text x="14" y="23" fill="#c084fc" class="font-sans" font-size="13" font-weight="600">🤖 Self-Healing</text>
      </g>

      <!-- Badge 3: Cloud Test Grids -->
      <g transform="translate(298, 0)">
        <rect width="128" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" />
        <rect x="0" y="0" width="128" height="36" rx="8" fill="none" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.3" />
        <text x="14" y="23" fill="#6ee7b7" class="font-sans" font-size="13" font-weight="600">☁️ Cloud Grids</text>
      </g>

      <!-- Badge 4: CI/CD Orchestration -->
      <g transform="translate(438, 0)">
        <rect width="154" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" />
        <rect x="0" y="0" width="154" height="36" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.3" />
        <text x="14" y="23" fill="#fcd34d" class="font-sans" font-size="13" font-weight="600">🔄 CI/CD Automation</text>
      </g>
    </g>

    <!-- Meta Status Line -->
    <g transform="translate(0, 375)">
      <text x="0" y="0" fill="#64748b" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="0.5">
        ENTERPRISE &amp; OPEN-SOURCE DIRECTORY • UPDATED FOR 2026
      </text>
    </g>

  </g>

  <!-- Subtle bottom accent line -->
  <rect x="0" y="418" width="1200" height="2" fill="url(#titleGradient)" opacity="0.6" />
</svg>
